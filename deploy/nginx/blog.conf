# ==============================================================================
# BlogWeb Nginx Location 参考配置（硬编码供快速查阅/直接复制）
# 适用场景：追加至宿主机主站点 /etc/nginx/sites-available/corp-mss.conf 的 server { } 块
# ==============================================================================

# 1. 自动补全末尾斜杠（访问 /me/blog 时重定向至 /me/blog/，避免被根路径 location / 拦截）
location = /me/blog {
    return 301 /me/blog/;
}

# 2. 个人博客 SPA 路由分发（dist 部署于 /var/www/me/blog；root 取父根 /var/www）
location /me/blog/ {
    root /var/www;
    try_files  / /me/blog/index.html;

    # 静态资产长效缓存 (Vite 打包自带 hash)
    location ~* /me/blog/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control public, no-transform, immutable;
        access_log off;
    }

    # 核心入口页面无缓存 + 显式补齐安全响应头
    location = /me/blog/index.html {
        add_header Cache-Control no-cache, no-store, must-revalidate;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection 1; mode=block always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 0;
    }
}