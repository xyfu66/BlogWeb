# ==============================================================================
# BlogWeb 专属路由配置片段 - 模块化防污染设计
# 引入方式: 在宿主机主 Server 块中添加 `include /etc/nginx/snippets/*.conf;`
# (或在包含兄弟工程的指定 server 块中 include 该文件)
# ==============================================================================

# 使用 ^~ 修饰符：一旦命中此前缀，彻底停止后续所有顶层正则 Location 匹配，
# 防止被兄弟工程或全局定义的正则规则（如 location ~* \.(js|css)$）恶意劫持
location ^~ /me/blog/ {
    alias /var/www/me/blog/;
    try_files $uri $uri/ /me/blog/index.html;

    # 1. 前端构建产物 (Vite hash assets) 长效长缓存 (30 天)
    # 使用 ^~ 前缀匹配并显式指定 alias，彻底避免 Nginx 嵌套正则无法继承 alias 的已知陷阱
    location ^~ /me/blog/assets/ {
        alias /var/www/me/blog/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # 2. SPA 入口 HTML 严禁缓存，确保版本更新即时生效并追加标准安全响应头
    location = /me/blog/index.html {
        alias /var/www/me/blog/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 0;
    }
}
