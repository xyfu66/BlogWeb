# ==============================================================================
# BlogWeb Nginx Location 配置建议
# 使用方式: 将以下 location 块直接复制到宿主机域名对应的 server { ... } 块内
# ==============================================================================

# 使用 ^~ 修饰符：匹配此前缀后停止后续正则扫描，防止被其他顶层正则规则劫持
location ^~ /me/blog/ {
    alias /var/www/me/blog/;
    try_files $uri $uri/ /me/blog/index.html;

    # 1. 前端构建产物 (Vite hash assets) 长效缓存 (30 天)
    location ^~ /me/blog/assets/ {
        alias /var/www/me/blog/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # 2. SPA 入口 HTML 严禁缓存，确保版本更新即时生效并追加标准安全响应头
    location = /me/blog/index.html {
        alias /var/www/me/blog/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 0;
    }
}
