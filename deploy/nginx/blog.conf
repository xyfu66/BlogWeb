# ==============================================================================
# BlogWeb Nginx Location 参考配置（硬编码供快速查阅/直接复制）
# 适用场景：追加至宿主机主站点 /etc/nginx/sites-available/corp-mss.conf 的 server { } 块
# ==============================================================================

# 1. 自动补全末尾斜杠（访问 /me/blog 时重定向至 /me/blog/，避免被根路径 location / 拦截）
location = /me/blog {
    return 301 /me/blog/$is_args$args;
}

# 2. 静态资产长效缓存（Vite 构建 hash 资产，30 天不可变缓存）
location ~* /me/blog/assets/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    root /var/www;
    expires 30d;
    add_header Cache-Control "public, no-transform, immutable";
    access_log off;
}

# 3. SPA 入口 index.html 防缓存（显式补齐安全响应头，修复 Nginx add_header 继承断层）
location = /me/blog/index.html {
    root /var/www;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    expires 0;
}

# 4. 个人博客 SPA 路由分发（dist 部署于 /var/www/me/blog；root 取父根 /var/www）
location /me/blog/ {
    root /var/www;
    try_files $uri $uri/ /me/blog/index.html;
}
